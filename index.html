<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durable stream</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<main>
  <h1>Durable stream</h1>
  <span class="status" id="status" data-state="idle">booting</span>

  <dl class="endpoints">
    <dt>stream</dt>
    <dd><button class="copy" id="ep-get" title="copy">…</button></dd>
    <dt>append</dt>
    <dd><button class="copy" id="ep-post" title="copy">…</button></dd>
    <dt>blob</dt>
    <dd><button class="copy" id="ep-blob" title="copy">…</button></dd>
  </dl>

  <ol class="feed" id="feed" aria-live="polite"></ol>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
